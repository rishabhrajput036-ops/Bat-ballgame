 <!DOCTYPE html>
<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; qcharset=UTF-8">
  <link rel="stylesheet" href="styles/style.css" />
  <title>Cricket by rishabh</title>
</head>
<body>

  <h1 style="text-align: center;">Bat ball stump game by rishabh</h1>

  <!-- Bat Button -->
  <button class="choice-button" onclick="
    let computerChoice = generateComputerChoice();
    let resultMsg = getResult('Bat', computerChoice);
    showResult('Bat', computerChoice, resultMsg);
  ">
    <img src="images/bat.png" alt="Bat Image" class="choice-image">
  </button>

  <!-- Ball Button -->
  <button class="choice-button" onclick="
    let computerChoice = generateComputerChoice();
    let resultMsg = getResult('Ball', computerChoice);
    showResult('Ball', computerChoice, resultMsg);
  ">
    <img src="images/ball.png" alt="Ball Image" class="choice-image">
  </button>

  <!-- Stump Button -->
  <button class="choice-button" onclick="
    let computerChoice = generateComputerChoice();
     resultMsg = getResult('Stump', computerChoice);
    showResult('Stup', computerChoice, resultMsg);
  ">
    <img src="images/stump.png" alt="Stump Image" class="choice-image">
  </button>

  <script>
    let score = {
      win: 0,
      loss: 0,
      tie: 0
    };

    function generateComputerChoice() {
      let rn = Math.random() * 3;
      if (rn <= 1) {
        return 'Bat';
      } else if (rn <= 2) {
        return 'Ball';
      } else {
        return 'Stump';
      }
    }

    function getResult(userMove, computerMove) {
      if (userMove === 'Bat') {
        if (computerMove === 'Ball') {
          score.win++;
          return 'User won.';
        } else if (computerMove === 'Bat') {
          score.tie++;
          return "It's a tie.";
        } else if (computerMove === 'Stump') {
          score.loss++;
          return 'Computer has won.';
        }
      } else if (userMove === 'Ball') {
        if (computerMove === 'Ball') {
          score.tie++;
          return "It's a tie.";
        } else if (computerMove === 'Bat') {
          score.loss++;
          return 'Computer has won.';
        } else if (computerMove === 'Stump') {
          score.win++;
          return 'User won.';
        }
      } else if (userMove === 'Stump') {
        if (computerMove === 'Ball') {
          score.loss++;
          return 'Computer has won.';
        } else if (computerMove === 'Bat') {
          score.win++;
          return 'User won.';
        } else if (computerMove === 'Stump') {
          score.tie++;
          return "It's a tie.";
        }
      }
    }

    function showResult(userMove, computerMove, resultMsg) {
      console.log(JSON.stringify(score));
      alert(`You have chosen ${userMove}. Computer choice is ${computerMove}. 
      
   ${resultMsg}
      
   won:${score.win} loss:${score.loss}  tie:${score.tie}
     
   JAI HIND
      `
      
    
      );
    }
				console.log(JSON.stringify(score));
  
  
  </script>

</body>
</html>
